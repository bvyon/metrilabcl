name: Hub de ebooks — CI del generador

# El sitio vive en hub-ebooks/ y se despliega en Vercel, que corre su propio build en cada
# push (ver DESPLIEGUE.md y vercel.json). Este workflow NO despliega nada: es el CI que pone
# rojo el repositorio si el generador o los datos se rompen, para enterarnos aqui y no en el
# log de Vercel.
#
# El build corre sin SITE_BASE_URL a proposito: asi ejercita el camino de respaldo
# (site.config.json baseUrl) que es el que usa cualquiera que clone el repositorio.

on:
  push:
    branches: [main]
    paths:
      - 'hub-ebooks/**'
      - '.github/workflows/hub-ebooks.yml'
  pull_request:
    paths:
      - 'hub-ebooks/**'
      - '.github/workflows/hub-ebooks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-ebooks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # El generador no tiene dependencias: sin npm install. Si el chequeo de salud o el
      # build fallan, exit != 0 y el workflow se cae.
      - name: Chequeo de salud del generador
        run: node src/selftest.mjs

      - name: Build
        run: node src/build.mjs
